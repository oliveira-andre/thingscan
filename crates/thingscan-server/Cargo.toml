[package]
name = "thingscan-server"
version = "0.1.0"
description = "Thingscan accounts and end-to-end encrypted device sync"
edition = "2024"

[dependencies]
argon2 = "0.5"
axum = "0.8"
base64 = "0.23.1"
getrandom = "0.4.3"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }

[dev-dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
