[package]
name = "thingscan-core"
version = "0.1.0"
edition = "2024"
description = "Finds and checks smart-home devices the way the SmartThings app does"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
btleplug = "0.13.5"
ciborium = "0.2.2"
futures = "0.3.34"
if-addrs = "0.15.0"
mdns-sd = "0.21.6"
native-tls = "0.2.18"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "form"] }
roxmltree = "0.21.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
socket2 = "0.6.5"
tokio = { version = "1.54.1", features = ["full"] }
tokio-tungstenite = { version = "0.30.0", features = ["native-tls"] }
uuid = { version = "1.29.0", features = ["v4"] }
