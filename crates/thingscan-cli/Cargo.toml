[package]
name = "thingscan-cli"
version = "0.1.0"
edition = "2024"
description = "Command-line scanner for smart-home devices"

[[bin]]
name = "thingscan"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
serde_json = "1.0.154"
thingscan-core = { path = "../thingscan-core" }
tokio = { version = "1.54.1", features = ["full"] }
